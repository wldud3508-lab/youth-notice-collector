name: 매일 공고 수집

on:
  schedule:
    - cron: "0 0 * * *"        # 매일 00:00 UTC = 한국시간 09:00. GitHub 사정으로 수십 분 늦거나 드물게 건너뛸 수 있음
  workflow_dispatch:            # '지금 수집' — Actions 화면의 Run workflow 버튼
    inputs:
      force:
        description: "오늘 이미 성공한 출처도 다시 수집"
        type: boolean
        default: false
      sources:
        description: "이번 실행에서만 켤 출처(쉼표 구분, 예: kosaf). 비우면 평소 설정"
        type: string
        default: ""
      dry_run:
        description: "시험 실행: 누적 데이터 사본으로만 돌리고 저장·화면 배포는 하지 않음"
        type: boolean
        default: false

permissions:
  contents: write               # data 브랜치에 누적 DB 커밋
  pages: write
  id-token: write

concurrency:                    # 같은 시각에 두 번 돌지 않게
  group: daily-collect
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  # 켤 출처(쉼표 구분). 첫 실행은 정부24만. 나중에 저장소 Variables의 ENABLED_SOURCES 로 바꿀 수 있음
  ENABLED_SOURCES: ${{ inputs.sources || vars.ENABLED_SOURCES || 'gov24' }}
  DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
  NOTICE_DB: store/notices.db
  NOTICE_OUT: store/public

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 누적 데이터 가져오기 (data 브랜치)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null; then
            git clone --quiet --depth 1 --branch data "$REMOTE" store
          else
            echo "data 브랜치가 없어 새로 만듭니다(첫 실행)."
            mkdir store && git -C store init -q -b data && git -C store remote add origin "$REMOTE"
          fi

      - name: 시험 실행이면 누적 데이터 사본 사용
        if: env.DRY_RUN == '1'
        run: |
          cp -r store trial
          echo "NOTICE_DB=trial/notices.db" >> "$GITHUB_ENV"
          echo "NOTICE_OUT=trial/public" >> "$GITHUB_ENV"
          echo "시험 실행: 켤 출처 = $ENABLED_SOURCES (저장·배포 안 함)"

      - name: 수집 실행
        id: run1
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          YOUTHCENTER_API_KEY: ${{ secrets.YOUTHCENTER_API_KEY }}
          KOSAF_ODCLOUD_PATH: ${{ vars.KOSAF_ODCLOUD_PATH }}
          KOSAF_CSV_PATH: ${{ vars.KOSAF_CSV_PATH }}
          KOSAF_SOURCE_VERSION: ${{ vars.KOSAF_SOURCE_VERSION }}
          CAMPUSCHOLAR_CONFIRMED: ${{ vars.CAMPUSCHOLAR_CONFIRMED }}
          INCLUDE_PUBLIC_RENTAL: ${{ vars.INCLUDE_PUBLIC_RENTAL }}
          COLLECT_TRIGGER_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/collect.yml
        run: python -m collector run ${{ inputs.force && '--force' || '' }}

      - name: 실패한 출처만 10분 뒤 재시도
        id: run2
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          YOUTHCENTER_API_KEY: ${{ secrets.YOUTHCENTER_API_KEY }}
          KOSAF_ODCLOUD_PATH: ${{ vars.KOSAF_ODCLOUD_PATH }}
          KOSAF_CSV_PATH: ${{ vars.KOSAF_CSV_PATH }}
          KOSAF_SOURCE_VERSION: ${{ vars.KOSAF_SOURCE_VERSION }}
          CAMPUSCHOLAR_CONFIRMED: ${{ vars.CAMPUSCHOLAR_CONFIRMED }}
          INCLUDE_PUBLIC_RENTAL: ${{ vars.INCLUDE_PUBLIC_RENTAL }}
          COLLECT_TRIGGER_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/collect.yml
        run: |
          if [ "$DRY_RUN" != "1" ] && grep -q "| 실패 |" "$NOTICE_OUT/summary.md" 2>/dev/null; then
            sleep 600
            python -m collector run      # 이미 성공한 출처는 자동으로 건너뜀
          else
            echo "재시도할 출처 없음"
          fi

      - name: 누적 데이터 저장 (data 브랜치에 커밋)
        if: always() && env.DRY_RUN != '1'
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "data: $(date +%F) 수집 결과"
          git push -q origin HEAD:data

      - name: 실행 결과 요약 표시
        if: always()
        run: |
          if [ "$DRY_RUN" = "1" ]; then echo "> **시험 실행** — 누적 데이터 사본으로 돌렸고 저장·화면 배포는 하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"; fi
          cat "$NOTICE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY" || echo "요약 파일 없음" >> "$GITHUB_STEP_SUMMARY"

      - name: 관리 화면 묶기
        if: always() && env.DRY_RUN != '1'
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          if [ -f store/public/latest.json ]; then
            cp store/public/latest.json store/public/summary.md _site/data/
            cp -r store/public/csv _site/data/csv
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always() && env.DRY_RUN != '1'
        with:
          path: _site

      - name: 성공한 출처가 없으면 실패로 표시
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          try:
              import os
              st = json.load(open(os.environ["NOTICE_OUT"] + "/latest.json", encoding="utf-8"))["meta"]["batch_status"]
          except Exception as e:
              print("결과 파일을 만들지 못했습니다:", e); sys.exit(1)
          print("배치 상태:", st)
          if st == "실패":
              print("성공한 출처가 없습니다(정상 완료 아님). 실행 요약의 오류 내용을 확인하세요."); sys.exit(1)
          PY

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
